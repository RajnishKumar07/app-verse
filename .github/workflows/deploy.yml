name: Firebase Deploy with Docker

on:
  push:
    branches:
      - angular-19-with-nest-api
  pull_request:
    types: [closed]
    branches: [angular-19-with-nest-api]

jobs:
  deploy:
    if: github.event.pull_request.merged == true || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: docker build -t ecommerce-app -f apps/e-commerce/Dockerfile .

      - name: Create output directory
        run: mkdir -p output

      - name: Extract build output from Docker image
        run: |
          mkdir -p dist
          container_id=$(docker create ecommerce-app)
          docker cp $container_id:/usr/share/nginx/html ./dist/apps/e-commerce
          docker rm $container_id


      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --token "${{ secrets.FIREBASE_SERVICE_ACCOUNT_ECOMMERCE_ANGULAR_V2 }}"

