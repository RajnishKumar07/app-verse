name: Firebase Deploy with Docker

on:
  push:
    branches:
      - angular-19-with-nest-api
  pull_request:
    types: [closed]
    branches: [angular-19-with-nest-api]

jobs:
  deploy:
    if: github.event.pull_request.merged == true || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: docker build -t ecommerce-app -f apps/e-commerce/Dockerfile .

      - name: Run Firebase deploy in Docker container
        run: |
          docker run --rm \
            -e FIREBASE_TOKEN=${{ secrets.FIREBASE_TOKEN }} \
            -v ${{ github.workspace }}:/app \
            -w /app \
            node:18-alpine sh -c "
              npm install -g firebase-tools && \
              firebase deploy --only hosting
            "
